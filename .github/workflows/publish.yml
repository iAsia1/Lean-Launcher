name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove large folders not needed for build
        shell: bash
        run: |
          rm -rf dist
          rm -rf minecraft/assets/objects
          rm -rf minecraft/libraries
          rm -rf minecraft/natives
          rm -rf minecraft/logs
          rm -rf minecraft/cache
          rm -rf minecraft/saves
          rm -rf minecraft/instances
          rm -rf minecraft/forge
          rm -rf minecraft/config
          rm -rf minecraft/mods
          rm -rf minecraft/resourcepacks
          rm -f forge-*.jar forge-*.log

      - run: npm install

      - name: Build and publish to GitHub Releases
        run: npx electron-builder --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}